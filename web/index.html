<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PowerDiag OBI</title>
<meta name="description" content="Battery pack diagnostics in the browser, over USB.">
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<header class="appbar">
  <div class="appbar-left">
    <a class="appbar-brand" href="https://powerdiag.jp">PowerDiag</a>
    <span class="appbar-product">OBI</span>
  </div>
  <div class="appbar-right">
    <span id="conn-info" class="conn-state hidden"><i class="dot on"></i><span id="port-name" class="port">&mdash;</span></span>
    <button id="btn-disconnect" class="btn small hidden" data-i18n="btn.disconnect">Disconnect</button>
    <select id="lang" aria-label="Language"></select>
    <a id="btn-close" class="iconbtn" href="https://powerdiag.jp" aria-label="Close">&times;</a>
  </div>
</header>

<!-- Shown until a board is connected: name, one button, nothing else. -->
<section id="landing" class="landing">
  <img src="./icon.svg" alt="" width="76" height="76">
  <h1 class="landing-title">PowerDiag OBI</h1>
  <p class="landing-sub" data-i18n="app.subtitle">Battery diagnostics</p>
  <button id="btn-connect" class="btn primary big" data-i18n="btn.connect">Connect</button>
  <p class="status landing-status" data-i18n="status.idle">Not connected</p>
  <p id="driver-hint" class="hint hidden" data-i18n="err.driver"></p>
  <div id="unsupported" class="banner hidden"></div>
</section>

<div id="dashboard" class="hidden">

  <main id="panels">

    <section class="hero">
      <div class="hero-main">
        <span class="hero-label" data-i18n="field.packVoltage">Pack voltage</span>
        <output id="hero-voltage" class="hero-value">&mdash;</output>
      </div>
      <div class="hero-side">
        <output id="hero-model" class="hero-model">&mdash;</output>
        <span id="state-badge" class="badge hidden"></span>
      </div>
    </section>

    <section class="actions">
      <button id="btn-read" class="btn primary needs-connection" data-i18n="btn.read">Read battery info</button>
      <button id="btn-cells" class="btn needs-connection" data-i18n="btn.cells">Read cell voltages</button>
      <button id="btn-clear" class="btn danger needs-connection" data-i18n="btn.clearErrors">Clear errors</button>
      <button id="btn-leds-on" class="btn ghost needs-connection" data-i18n="btn.ledsOn">LEDs on</button>
      <button id="btn-leds-off" class="btn ghost needs-connection" data-i18n="btn.ledsOff">LEDs off</button>
    </section>

    <p id="note-limited" class="hint warn hidden" data-i18n="note.limited"></p>

    <div class="grid">

      <article class="card">
        <h2 data-i18n="sec.voltages">Voltages</h2>
        <div id="cell-bars" class="bars"></div>
        <dl id="cell-fields" class="fields compact"></dl>
        <dl id="voltage-fields" class="fields"></dl>
      </article>

      <article class="card">
        <h2 data-i18n="sec.identity">Identity</h2>
        <dl id="identity-fields" class="fields"></dl>
        <div class="msg-wrap">
          <dt data-i18n="field.message">Battery message</dt>
          <dd id="v-message" class="mono wrap">&mdash;</dd>
        </div>
        <p class="footnote" data-i18n="note.charge"></p>
      </article>

    </div>

    <section class="logsec">
      <button id="btn-log" class="btn ghost small" data-i18n="log.show">Show log</button>
      <div id="log" class="log hidden" aria-live="polite"></div>
    </section>

  </main>

</div>

<footer class="statusbar">
  <span class="status" data-i18n="status.idle">Not connected</span>
  <span class="copyright">&copy; 2026 powerdiag.jp</span>
</footer>

<script type="module" src="./js/app.js"></script>
</body>
</html>
